name: Setup GitNexus
description: Setup Node.js 22, install dependencies, and optionally build

inputs:
  build:
    description: Whether to run npm run build after install
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: gitnexus/package-lock.json

    - name: Build gitnexus-shared
      run: npm install && npm run build
      shell: bash
      working-directory: gitnexus-shared

    # npm 10's bundled node-gyp 11 can't find Visual Studio 2026 (18.x) on
    # windows-latest. A failed native build makes npm silently drop the
    # optionalDependency tree-sitter-kotlin, and every Kotlin test then fails.
    # node-gyp 12.1.0 added VS 2026 support.
    - name: Use a node-gyp that supports Visual Studio 2026
      if: runner.os == 'Windows'
      run: |
        npm install -g node-gyp@12.4.0
        echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      shell: bash

    - name: Install dependencies
      run: |
        npm ci
        if [ ! -d node_modules/tree-sitter-kotlin ]; then
          echo "::error::tree-sitter-kotlin failed to install; its native build did not run or failed"
          exit 1
        fi
      shell: bash
      working-directory: gitnexus

    - name: Build
      if: ${{ inputs.build == 'true' }}
      run: npm run build
      shell: bash
      working-directory: gitnexus
